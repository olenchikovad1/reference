# Опциональное наложение. Воркера обновляют отдельно после отключения потребителя в API.
services:
  api:
    environment:
      VOICE_CONSUMER_IN_API: "false"

  voice:
    image: reference-api:${REFERENCE_VOICE_TAG:-${REFERENCE_TAG:?}}
    environment:
      DATABASE_URL: ${REFERENCE_VOICE_DATABASE_URL:-${DATABASE_URL:?}}
      S3_ENDPOINT: ${REFERENCE_VOICE_S3_ENDPOINT:-${S3_ENDPOINT:?}}
      S3_BUCKET: ${REFERENCE_VOICE_S3_BUCKET:-${S3_BUCKET:?}}
      S3_ACCESS_KEY: ${REFERENCE_VOICE_S3_ACCESS_KEY:-${S3_ACCESS_KEY:?}}
      S3_SECRET_KEY: ${REFERENCE_VOICE_S3_SECRET_KEY:-${S3_SECRET_KEY:?}}
      S3_REGION: ${REFERENCE_VOICE_S3_REGION:-${S3_REGION:-ru-central1}}
      AMQP_URL: ${REFERENCE_VOICE_AMQP_URL:-${AMQP_URL:?}}
      FILES_VOLUME_PATH: /srv/reference/files
      FIXTURES_PATH: /srv/reference/fixtures
      EMBEDDING_MODEL_PATH: /srv/reference/files/models/unavailable.onnx
      VOICE_CPU_THREADS: ${REFERENCE_VOICE_CPU_THREADS:-2}
    command: ["python", "-m", "reference_api.consumers.review"]
    restart: unless-stopped
    stop_grace_period: 90s
    cpus: ${REFERENCE_VOICE_CPUS:-2}
    mem_limit: ${REFERENCE_VOICE_MEMORY:-896m}
    memswap_limit: ${REFERENCE_VOICE_MEMORY:-896m}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      api: {condition: service_healthy}
    volumes:
      - "../infra/stand/files/models/faster-whisper-small:/srv/reference/files/models/faster-whisper-small:ro"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/reference-voice.ready"]
      interval: 10s
      timeout: 2s
      retries: 6
