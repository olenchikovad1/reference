# Палитра стенда: двенадцать контрастных цветов из справочника Cosmic.
#
# Значения настоящие, не придуманные: выгружены 23.09.2026 из cosmicplm-db
# (10.10.10.71) ролью только на чтение plmportal_ro. По одному цвету на
# цветовую группу, внутри группы взят самый насыщенный; для чёрного и белого —
# крайние по светлоте.
#
# Составляющие хранятся числами, а не строкой #RRGGBB: по ним считают
# расстояние между цветами при подборе замены, и собрать строку из чисел
# дешевле, чем разобрать числа из строки. Так же устроено в plm.
#
# Cosmic искореняется, справочник переезжает в портал plm. Когда переезд
# закончится, источником станет он, и этот файл заменится выгрузкой оттуда.
