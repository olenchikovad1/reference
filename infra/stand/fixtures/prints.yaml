# Настоящие принты для стенда — и заодно эталонный набор для подбора порога
# похожести (US-0431).
#
# Без такого набора порог ставится наугад и остаётся наугад навсегда: на одном
# примере его не проверить. Здесь записано, что от узнавания ОЖИДАЕТСЯ, — и это
# записано ДО того, как порог подобран, иначе ожидание превратится в пересказ
# результата.
#
# Файлы лежат в томе (`infra/stand/files/prints/`) и приходят с клоном
# (решение 0012): на них стоят проверки и замеры. Скопированы владельцем
# 23.09.2026, заново присланы 25.09.2026 — совпали по размеру байт в байт.

