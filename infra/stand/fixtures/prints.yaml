# принтах выше и обязаны воспроизводиться на них же — новые картинки меняли
# бы их молча. Ожидания записываются ДО любого замера на картинке.
#
# tags_expected — теги, которые картинка должна получить, в словарной форме;
# search_expected — слова, по которым поиск по смыслу обязан её находить
