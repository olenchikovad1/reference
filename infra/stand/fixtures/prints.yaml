    subject: крейсер «Маршал Устинов»
    category: корабль
    note: "новогодняя рамка: хвоя, шишки, гирлянда, белка; версия v4 от владельца 25.09.2026"
    source: владелец
    tags_expected: [крейсер, корабль, море, белка, шишка, хвоя, гирлянда, снег]
    search_expected: [белка, шишки, хвоя, гирлянда, новый год, ёлка, крейсер, корабль, море, снег]
    expected_by: >-
      Записано 25.09.2026 до любого замера. «Белка, шишки, хвоя, гирлянда и
      всякое, связанное с новым годом» — слова владельца, и он просил именно
      поиск по смыслу, а не теги. Ёлка, крейсер, корабль, море, снег — мои по
      картинке.
    sha256: 5236839b927350c65da0c2318e3a464456e80a23e1605d9453967a804a94a761

