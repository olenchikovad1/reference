  - level: тот же объект
    must_match: true
    pairs:
      - [anime-wikipe-tan.png, anime-wikipe-tan-kagome.png]   # один персонаж, разные рисунки
  - level: та же категория
    must_match: false
    pairs:
      - [car-red-sports.png, car-blue-sports.png]
      - [teddy-bear-toy.png, teddy-bear-with-ball.png]
      - [teddy-bear-toy.png, teddy-bear-photo.png]
      - [soccer-ball.png, soccer-ball-flaming.png]
      - [text-keep-calm.png, text-happy-birthday.png]
      - [anime-girl.png, anime-wikipe-tan.png]
  - level: чужое
    must_match: false
    pairs:
      - [pizza.png, t72-winter-print.png]
      - [rose-red.png, rocket.png]
      - [christmas-tree.png, car-red-sports.png]
      - [rubber-duck-photo.png, mi8-cloud-sharp-clean-print.png]

# Поиск по смыслу: слово запроса обязано поднять эти картинки выше остальных —
# «новый год» оба новогодних принта, крейсер и ёлку; «мяч» — оба мяча и мишку
# с мячом. Записано 25.09.2026 до замера (план 071, US-0480).
tuning_search_groups:
  новый год: [ustinov-newyear-print.png, christmas-tree.png]
  мяч: [soccer-ball.png, soccer-ball-flaming.png, teddy-bear-with-ball.png]
  игрушка: [teddy-bear-toy.png, teddy-bear-with-ball.png, teddy-bear-photo.png, robot-kawaii.png, rubber-duck-photo.png]
  надпись: [text-keep-calm.png, text-happy-birthday.png, cat-felix.png]

# Чего ждём от узнавания. Три уровня, и порог обязан их разделять: если между
# «тот же объект» и «та же категория» он не различает, узнавание будет
# срабатывать на каждом втором танке и его перестанут читать.
expectations:
  - level: тот же объект
    must_match: true
    pairs:
      - [td-rusty-print.png, td-winter-camo-print.png]     # Об. 268 в двух видах
    note: >-
      Разная окраска, разное время года, разный ракурс — но объект один.
      Хеш содержимого такую пару не поймает: файлы разные. Ловить обязан вектор.

  - level: та же категория
    must_match: false
    pairs:
      - [conqueror-red-print.png, t14-armata-print.png]
      - [t72-winter-print.png, is3-summer-print.png]
      # Перенесена из «тот же объект» 25.09.2026: владелец поправил подпись —
      # is3-summer это ИС-7. Ожидание писалось по неверной подписи, а не по картинке.
      - [is3-summer-print.png, is3-winter-print.png]
    note: >-
      Все танки, и похожесть будет заметной. Но срабатывать окно здесь НЕ
      должно: «у нас уже был какой-то танк» — не новость, а шум. Это верхняя
      граница порога.

  - level: чужое
    must_match: false
    pairs:
      - [mi8-cloud-sharp-clean-print.png, t72-winter-print.png]
      - [mi8-cloud-sharp-clean-print.png, td-rusty-print.png]
    note: Нижняя проверка на здравый смысл. Сработает здесь — порог негоден.

# Замечено при осмотре, проверить при первом использовании.
caveats:
  - >-
    Фон НЕ вырезан. У td-rusty глазами видно всю сцену: танк, небо, заснеженный
    лес, столб; прозрачны только углы за мягкой виньеткой (около трети кадра).
    Остальные того же происхождения и, скорее всего, такие же — но проверено
    глазами пока одно изображение, и выдавать предположение за факт нельзя.
  - >-
    Измерено 25.09.2026 для всех (scripts/prints/alpha.py): у каждого принта
    набора и крейсера центр кадра непрозрачен целиком, прозрачна только рамка
    — 18–42 % площади. Вырезанного силуэта в наборе нет ни одного.
  - >-
    Для стенда это не помеха, а полезный случай: именно так выглядит путь «фон
    не вырезан, видно прямоугольник», который US-0420 обязана объяснять словами.
    Но для проверки «как принт садится по складкам» нужен хотя бы один настоящий
    вырезанный силуэт — иначе смотреть будем на прямоугольник со сценой.

# Эталонные принты. Рисуются кодом, а не руками: размеры в них часть ответа, и
# подогнанные на глаз они превращают измерительный инструмент во врущий.
# Каждый подписан вопросом, на который отвечает, а не именем файла.
probes:
  - {name: setka-20cm.png, width_cm: 20, subject: контрольная сетка 20x20 см,
     answers: искажение по складкам и правдоподобна ли калибровка}
  - {name: linii-2-1-05-025mm.png, width_cm: 16, subject: линии 2 / 1 / 0.5 / 0.25 мм,
     answers: с какой толщины линия перестаёт читаться}
  - {name: bukvy-10-6-4-3mm.png, width_cm: 16, subject: буквы 10 / 6 / 4 / 3 мм,
     answers: с какого кегля буква перестаёт читаться}
  - {name: plashka-rezkiy-kray.png, width_cm: 12, subject: плашка с резкой границей,
     answers: как ведёт себя смещение на краю}
  - {name: fon-ne-vyrezan.png, width_cm: 12, subject: непрозрачный фон,
     answers: как выглядит принт, у которого фон не вырезан}

# ИЗМЕРЕНО 23.09.2026, US-0431. Записано ПОСЛЕ ожиданий выше и отдельно от них,
# чтобы ожидание не превратилось в пересказ результата.
#
# Модель: clip-vit-base-patch32, кодировщик изображений, квантованный.
measured:
  model: clip-vit-base-patch32/vision/quantized

  # Ожидание «тот же объект узнаётся» НЕ ВЫПОЛНЕНО, и порогом это не лечится.
  same_object: не_разделяется
  same_object_note: >-
    Пара Об. 268 дала 0.835 и оказалась на шестнадцатом месте из двадцати
    восьми — ниже тринадцати пар РАЗНЫХ танков. Т-72 с Об. 268 похожи сильнее
    (0.897), чем Об. 268 сам на себя. Пара ИС-3 дала 0.882, тоже ниже нескольких
    чужих пар. Разделяющего порога не существует.
    Причина в модели, а не в настройке: все восемь принтов — это «танк в зимнем
    пейзаже», и сцена весит больше, чем машина в ней.

  same_object_correction: >-
    25.09.2026: «пара ИС-3» (0.882) — на деле ИС-7 и ИС-3, разные танки той же
    категории. Вывод «не разделяется» держится на паре Об. 268 и от поправки не
    меняется: 0.882 лежит внутри диапазона танков между собой.

  # Ожидание «чужое не срабатывает» ВЫПОЛНЕНО с запасом.
  foreign: разделяется
  foreign_range: [0.679, 0.738]   # вертолёт против любого танка
  tanks_range: [0.763, 0.897]     # танки между собой

  # Случай, который работает и ради которого вектор и нужен: ТА ЖЕ картинка,
  # изменённая так, что хеш её не узнаёт. Ни один из пяти не совпал по хешу.
  same_picture: разделяется
  same_picture_threshold: 0.91
  same_picture_samples:
    - {change: уменьшена вдвое, similarity: 0.992}
    - {change: перекрашена теплее, similarity: 0.983}
    - {change: обрезана на 10%, similarity: 0.971}
    - {change: осветлена на треть, similarity: 0.960}
    - {change: пересохранена в JPEG 70, similarity: 0.915}
    - {change: другой объект — граница снизу, similarity: 0.896}

# Замер автотегов 24.09.2026 (US-0478), по tags_expected, записанным до замера,
# плюс пять надписей на белом (ждём только «Надпись») и три кадра толстовки
# (не ждём ничего). Теги соревнуются внутри группы; вероятность ≥ 0.3, до
# одного тега на группу.
measured_tags:
  settings: {template: "a photo of {}", probability_min: 0.3, per_group: 1}
  result: {correct: 27, extra: 4, missed: 11, f1: 0.78}
  with_implied: {correct: 44, extra: 6, missed: 11, f1: 0.84, why: следствия «Техника», «Военное», «Авиация» верны ровно тогда, когда верен тег объекта, — F1 растёт от них, а не от модели; сравнивать с result нельзя}
  first_try: {correct: 12, extra: 3, missed: 26, why: один порог на весь словарь — военные теги набирают больше снега на любом танке}
  removed: {Камуфляж: модель не отличает камуфляж от военной техники вообще}
  notes:
    - все семь танков — «Танк»; шесть из семи — «Снег» и «Зима» (у Т-14 снега под танком мало)
    - вертолёт — «Вертолёт», «Огонь», «Снег», «Зима»; пропущены «Дым» и «Лес»
    - кадры белой толстовки — ни одного тега: белый фон не засчитан за снег
    - надпись «TANK POWER» — «Танк» вместо «Надпись»: модель читает слово на картинке
    - второй тег местности (лес рядом со снегом, горы) почти не проходит — группа даёт один
    - «TANK POWER» тянет за «Танком» и «Технику» с «Военным»: одна ошибка модели — три лишних тега

# Замер 24.09.2026, US-0479: различает ли модель названия машин. Модель выбирала
# название из шести подписанных в каталоге (английскими формулировками, как
# машины называют в сети). scripts/measure_names.py.
measured_names:
  result: {correct: 3, of: 8, tanks_correct: 2, tanks_of: 7, chance_tanks: 1 из 5}
  margin_top3: [0.002, 0.005]   # между первыми тремя местами у танков — шум
  verdict: не_различает
  correction: >-
    25.09.2026: is3-summer — ИС-7, в каталоге выбора его не было. Из «двух
    угаданных ИС-3» угадан не больше один — танков угадано не больше одного из
    семи. Вывод прежний; число перемеряется с ИС-7 в каталоге (план 076, US-0517).
  remeasured:
    date: 2026-09-25
    catalogue: шесть танковых названий (добавлен ИС-7) и Ми-8
    result: {correct: 2, of: 8, tanks_correct: 1, tanks_of: 7, chance_tanks: 1 из 6}
    note: >-
      Угаданы Ми-8 и ИС-3; ИС-7 назван ИС-3 (0.298 против 0.298 — шум).
      Разрыв между первыми тремя местами у танков по-прежнему в тысячных.
      Вывод «не различает» подтверждён. scripts/embeddings/measure_names.py.
  note: >-
    Угадан вертолёт, единственный в наборе, и два ИС-3 — на уровне случайного
    выбора из пяти танковых названий. Догадка модели не показывается вовсе:
    название приходит из каталога или от той же картинки, узнанной вектором.

# Замер 24.09.2026, US-0482: двадцать тегов по весам из словаря языка, без
# списка допустимых. Те же tags_expected, в словарной форме («вертолет»,
# «гора»); набор меньше, чем у measured_tags: восемь принтов, две надписи, кадр
# белой худи — 36 ожидаемых тегов, из них 24 про сцену. scripts/measure_words.py.
#
# Столбцы: strong — ожидаемых среди сильных; top20 — ожидаемых в двадцатке;
# missing — ожидаемых вне двадцатки; first — у скольких картинок первый тег
# ожидаемый; strong_total — сильных всего; extra — сильных сверх ожидаемого;
# f1 — по сильным, той же мерой, что у закрытого словаря.
measured_words:
  model: clip-vit-b32-multilingual/quint8
  dictionary: «Новый частотный словарь русской лексики», существительные по частоте
  settings: {words: 10000, template: "{}", top: 20, strong_max: 10, strong_share: 0.2}
  result: {strong: 7, top20: 8, missing: 28, first: 1, strong_total: 44, extra: 37, f1: 0.17}
  without_exclusion: {strong: 7, top20: 8, missing: 28, first: 1, strong_total: 49, extra: 42, f1: 0.16}
  closed_dictionary: {correct: 27, extra: 4, missed: 11, f1: 0.78, snow_on_tanks: 6 из 7, note: "measured_tags — набор больше, 16 картинок"}
  verdict: хуже закрытого словаря вчетверо по F1; из ожидаемого находятся только предметы — «танк» и «вертолет»

  # Число слов по частоте. Разница в одну-две позиции на 11 картинках — шум;
  # 10 000 взято за наименьшее число лишних сильных. Предварительно.
  by_words:
    3000:  {strong: 7, top20: 9, first: 2, strong_total: 48, extra: 41, f1: 0.17}
    5000:  {strong: 7, top20: 8, first: 2, strong_total: 55, extra: 48, f1: 0.15}
    10000: {strong: 7, top20: 8, first: 1, strong_total: 44, extra: 37, f1: 0.17}
    21809: {strong: 5, top20: 8, first: 1, strong_total: 46, extra: 41, f1: 0.12, why: "первым на всех танках «танка» — стихотворная форма, модель читает её как «танк»; в первые 10 000 она не входит (место 11 690)"}

  # Доля сильных от самого сильного, при 10 000 словах. 0.2 и 0.25 дают один
  # F1; у 0.2 ожидаемых в сильных на одно больше. Предварительно.
  by_share:
    0.10: {strong: 8, strong_total: 80, f1: 0.14}
    0.15: {strong: 8, strong_total: 63, f1: 0.16}
    0.20: {strong: 7, strong_total: 44, f1: 0.17}
    0.25: {strong: 6, strong_total: 36, f1: 0.17}
    0.30: {strong: 5, strong_total: 33, f1: 0.14}

  # Сцена — «снег», «зима», «лес», «небо», «гора», «дым», «огонь».
  scene: {found: 0, of: 24, snow_rank_on_tanks: [100, 8593], of_words: 10000}
  scene_tries:
    - {way: "остаток — из картинки вычтена проекция на самое сильное слово, десять тегов из остатка", found: 0, f1: 0.17, note: "из остатка поднимается «логотип», а не снег"}
    - {way: "жадное вычитание — двадцать шагов, на каждом вычитается взятое слово", found: 0, f1: 0.09, note: "вслед за первым словом идут «логотип», «москвич», «дневальный», «стон», «сталинизм»"}
    - {way: "центрирование слов и картинок, шаблон «фото — слово», весь словарь (до US-0482, probe_words_centering.py)", found: 0}

  # Слова-группы людей (services/tags_excluded.yaml).
  excluded:
    count: 337
    groups: {nationality: 223, religion: 41, politics: 73}
    before: {appearances: 23, words: [белорус, большевик, славянин, славянофил, таджик, татарин, украинец, чеченец, эскимос]}
    after: 0
    rule_tried:
      - близость к понятию «национальность» — восемь известных слов на местах 10 757–17 100 из 21 809
      - уточнение «по национальности» — сходство слова с собой 0.97–0.99 у всех слов, группы вперемешку с «танком» и «снегом»
      - направление по восьми примерам — «танк» на 732-м месте, раньше 23 из 32 отложенных слов-групп
    verdict: правило не вышло, перечень; сверен с первыми шестьюдесятью словами каждой картинки набора

  notes:
    - все семь танков — «танк» в двадцатке, у шести из семи среди сильных; первым у всех семи идёт «артиллерия» или «артиллерист»
    - вертолёт — «вертолет» первым и единственным сильным (0.054), «танк» — двадцатым
    - надписи — «логотип», а не «надпись»; кадр худи — «пальто», «куртка», «свитер», а не «толстовка»
    - в хвосте двадцатки шум — «стон», «катализатор», «изображение», «дневальный», «волкодав», «сибиряк», «москвич»
    - названия учений не исключены и всплывают на танках — «империализм», «сталинщина», «сталинизм»
    - вес — доля слова среди 10 000; у первого тега 0.003–0.054, у двадцатого 0.0005–0.0016
