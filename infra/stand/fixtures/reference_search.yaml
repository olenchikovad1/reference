# Набор запросов к поиску по референсам (US-0498). Записан ДО замера: что
# каждый запрос обязан найти и чего находить не должен. Замер —
# scripts/embeddings/measure_reference_search.py; числа — в разделе measured.
#
# Ожидания — дропы, а не номера референсов: референсы на стенде заводятся
# руками и меняются, дропы и их ассортимент — сид. Референс «найден к дропу»,
# если он на цветомодели этого дропа.
queries:
  - {q: НГ, expect_drops: [Новый год 2027], why: сокращение из словаря}
  - {q: новогодний, expect_drops: [Новый год 2027], why: «как его ещё называют»}
  - {q: лето, expect_drops: [Пляжная коллекция 2027], why: месяцы выхода и смысл, слова «лето» нет}
  - {q: пляж, expect_drops: [Пляжная коллекция 2027], why: смысл названия}
  - {q: море, expect_drops: [Пляжная коллекция 2027], why: тема дропа}
  - {q: 23Ф, expect_drops: [23 февраля 2027], why: сокращение}
  - {q: зима, expect_drops: [Зима 2026/27], why: название и месяцы}
  - {q: ёлка, expect_drops: [Новый год 2027], why: тема дропа}
  - {q: весна, expect_drops: [Весна 2027], why: название}
  - {q: ДР, expect_drops: [], why: дня рождения среди дропов нет — пусто, а не догадка}
  - {q: жираф, expect_drops: [], why: ни в чём нет}

# Замер 25.09.2026, measure_reference_search.py на стенде: 5 живых референсов,
# 6 дропов. Мало — числа предварительные, и «23Ф» проверяет только то, что
# пустой дроп не даёт догадок: референсов в «23 февраля» на стенде нет.
measured:
  date: 2026-09-25
  references_on_stand: 5
  wanted: 14
  in_top10: 14
  extra: 1
  extra_note: "«зима» — №5: у него надпись «ЗИМА 2026», найден по надписи, а не по дропу; лишним он считается только потому, что его цветомодель не в «Зиме 2026/27»"
  drop_meaning:
    # measure_drop_meaning.py --centered: косинус после вычитания среднего словаря
    threshold: 0.45
    found: 6
    of: 9
    extra: 2
    extra_note: оба лишних — погашенный «Лето 2026» на «пляж» и «море», он и правда летний
    uncentered: все дропы в 0.80–0.97 к любому запросу, «жираф» 0.81 — без центровки порога нет
