# Изделие B-HDY-14 — единственное изделие стенда.
#
# Кадры состояний лежат в томе (`infra/stand/files/products/B-HDY-14/states/`)
# и приходят с клоном (решение 0012). Исходник модели — 444 МБ — в git не
# кладут (решение 0002): стенду он не нужен, код читает только путь.
#
# Хеши здесь затем, чтобы подмена файла в томе была видна, а не обнаруживалась
# по странному результату проверок.

code: B-HDY-14
display_name: Толстовка на молнии, капюшон
kind: hoodie

# Источник модели. Browzwear VStitcher 13.3.2 — не CLO 3D. Контейнер: SQLite
# с zstd-сжатыми блобами; лекала, швы в сантиметрах и градация лежат внутри,
# но формат закрытый, поэтому читается только то, что отдаёт VStitcher.
source:
  tool: browzwear-vstitcher
  tool_version: "13.3.2"
  path: products/B-HDY-14/source/1465 B-HDE.bw   # относительно FILES_VOLUME_PATH
  size_bytes: 444334080
  sha256: c0f1f9d031b5ef652412885b5846ee836ca321906db9746776a4be50cea3cb2d

# Размерный ряд из модели: рост 98–164, девочки. Не S/M/L/XL — разброс между
# крайними размерами здесь гораздо больше, и «влезает ли на S» означает «на 98».
size_set:
  name: 98-164 Девочки
  sizes: [98, 104, 110, 116, 122, 128, 134, 140, 146, 152, 158, 164]
  simulated: [98, 134, 164]     # для остальных симуляции в модели нет

# ВАЖНО: какой размер отрендерен — неизвестно. В именах кадров размера нет, а
# сам кадр этого не говорит. Разница между 98-м и 164-м больше половины, и
# ошибка здесь означает печать в полтора раза не того размера. Пока принято
# допущение, что это середина ряда; US-0430 попробует измерить по мешу.
rendered_size: null
rendered_size_assumed: 134

# Калибровка «сантиметры лекала ↔ пиксели кадра».
#
# ПРЕДВАРИТЕЛЬНАЯ. Получена делением измеренной высоты силуэта на прикидочную
# высоту изделия: 576 px на ~70 см у 134-го размера с надетым капюшоном.
# Настоящее число придёт из US-0430 либо от человека с рулеткой, и заменяется
# правкой этой строки — без кода и без пересборки.
#
# Границы неопределённости названы, чтобы никто не принял число за измерение:
# если отрендерен 164-й, будет около 7.4; если 98-й — около 11.5.
# Единица сцены модели — САНТИМЕТР. Доказано разбором аватаров из FBX:
# у avatar emil габарит по высоте 137.67 при заявленном росте 134, расхождение
# 2.7 % на причёску. Метр дал бы 1.37, миллиметр — 1376.
#
# Меш самого изделия достать не удалось: в snapshot/*.geo.gcs формат закрытый,
# найденные массивы float дают одинаковый габарит по всем трём осям, а одежда
# не куб. Лекала в garment.vsgx лежат в двоичных блоках offsetMap_cm без
# читаемой структуры. Три пути испробованы, ни один не дал координат.
#
# Следствие практическое: чтобы калибровка стала измеренной, нужно ОДНО число
# от человека — высота изделия от верха капюшона до низа подола в сантиметрах.
# Высота силуэта на кадре переда измерена и равна 576 пикселям, так что
# px_per_cm = 576 / H. Ни ширину груди, ни размер изделия угадывать не
# придётся.
scene_unit: cm
scene_unit_proven_by: габарит аватара emil 137.67 при росте 134
mesh_extraction: failed
calibration:
  px_per_cm: 7.38
  provisional: true
  derived_from: длина по центру спинки 52.6 см на 134 (медиана 12 табелей Cosmic) = 388 px кадра спины от горловины до низа; размер кадра принят 134 решением владельца 24.09.2026
  range_if_size_unknown: [7.4, 11.5]
  projection: perspective
  note: >-
    При ортографической камере силуэты переда и спины — зеркальные отражения с
    одинаковым габаритом. Здесь ширина 626 против 574 при общем центре, значит
    камера перспективная и единого px/см на весь кадр не существует. Калибруется
    плоскость печатной зоны; на краях силуэта погрешность больше, но там ничего
    не размещают.

# Состояния. Сейчас одно: капюшон надет, молния застёгнута.
states:
  - code: front
    display_name: Перед
    kind: precise              # по точным ракурсам считаются размещение и проверки
    hood: up
    zipper: closed
    frame: {path: products/B-HDY-14/states/front.png, width: 720, height: 720,
            sha256: 212bb0fcdcc00a89988470d077ff3a1ef97ee42332873102275533274afce6f2}
    # Кадр обесцвечен (насыщенность ровно 0), поэтому служит одновременно картой
    # освещения: цвет накладывается умножением, рельеф выводится из него же.
    maps: {lighting: frame, displacement: derived, ao: null, print_zone: manual}
    silhouette: {top: 26, bottom: 601, height_px: 576}
    # Ориентиры. От них отсчитывается размещение: «12 см ниже горловины».
    # Координаты в пикселях кадра, сняты по силуэту и по сетке.
    anchors:
      neck: [360, 215]         # низ проёма капюшона, он же линия воротника
      centre: [360, 380]       # центр переда
      hem: [360, 601]          # низ подола
      shoulder_left: [258, 228]
      shoulder_right: [462, 228]
    zones:
      # Куда можно печатать. Перед разрезан молнией, поэтому зона названа одна,
      # а молния лежит отдельной линией: пересечение с ней ловит линтер.
      # Верх поля — линия воротника, она же низ капюшона.
      print: [[252, 214], [468, 214], [468, 430], [252, 430]]
      pocket: [[272, 435], [448, 435], [440, 535], [280, 535]]
      hood: [[300, 26], [420, 26], [432, 120], [418, 195], [360, 212],
             [302, 195], [288, 120]]
    lines:
      zipper: [[360, 215], [360, 570]]

  - code: back
    display_name: Спина
    kind: precise
    hood: up
    zipper: closed
    frame: {path: products/B-HDY-14/states/back.png, width: 720, height: 720,
            sha256: 3960994617db8aaaba92dbe928f1478b65182c45a0fba64ea59beab703f3676d}
    defects:
      - clipped_top           # верх капюшона срезан границей кадра: 21 непрозрачный
                              # пиксель в нулевой строке
    maps: {lighting: frame, displacement: derived, ao: null, print_zone: manual}
    silhouette: {top: 0, bottom: 572, height_px: 573}
    anchors:
      neck: [360, 178]         # низ капюшона по центру спины
      centre: [360, 350]
      hem: [360, 555]
      shoulder_left: [252, 190]
      shoulder_right: [468, 190]
    zones:
      # Верх поля упирается в низ капюшона: выше печатать физически можно,
      # но там ляжет капюшон — на это и срабатывает проверка перекрытия.
      print: [[248, 180], [472, 180], [472, 505], [248, 505]]
      # Капюшон лежит ПОВЕРХ верха спины. Без этой зоны кадр спины врёт в самом
      # важном месте: принт, нарисованный сверху, показывает то, чего не бывает.
      hood: [[300, 0], [420, 0], [433, 60], [437, 120], [424, 155],
             [390, 176], [360, 179], [330, 176], [296, 155], [283, 120],
             [287, 60]]
    lines: {}

  - code: left
    display_name: Левый бок
    kind: illustrative        # только показ: силуэт сокращён втрое, размещать нельзя
    hood: up
    zipper: closed
    frame: {path: products/B-HDY-14/states/left.png, width: 720, height: 720,
            sha256: 8e881e63311806c32c66eb3398e909b678a06296a76f277370f12d27df1a7f1c}
    maps: {lighting: frame, displacement: derived, ao: null, print_zone: manual}
    silhouette: {top: 11, bottom: 601, height_px: 591}
    anchors: {}
    zones:
      # Рукав висит ПЕРЕД торсом и закрывает его почти во всю глубину на
      # уровне груди. Без этой зоны принт со спины рисовался бы поверх рукава —
      # то есть там, где его на изделии не видно. Обведено вручную по кадру
      # вместе с манжетой.
      sleeve: [[320, 278], [352, 274], [380, 280], [394, 292], [396, 320],
               [392, 350], [381, 390], [362, 430], [344, 462], [336, 482],
               [314, 484], [286, 478], [262, 464], [246, 448], [250, 420],
               [260, 400], [272, 370], [284, 340], [296, 315], [308, 294]]
    lines: {}

# Состояния, которых нет и которые в прототипе не появятся. Названы затем,
# чтобы отсутствие читалось как известное ограничение, а не как недоделка.
states_absent: [hood_down, zipper_open]

# Печатные поля по размерам — ограничение, куда физически можно печатать.
#
# ПРЕДВАРИТЕЛЬНЫЕ. Настоящие даёт технолог; эти прикинуты от ширины корпуса на
# кадре и линейно разведены по ряду. Нужны, чтобы проверкам было на чём
# работать, и помечены, чтобы их не приняли за таблицу технолога.
# Объём торса для показа. Меша нет — извлечь его из .geo.gcs не удалось, —
# поэтому торс упрощён до эллиптического цилиндра, чьи размеры измерены по
# самим кадрам. Этого хватает, чтобы принт у края спины сжимался, а не
# обрезался, и чтобы ушедшее за край было видно на боку.
#
# Ширина — по переду и спине НИЖЕ рукавов: там торс отделён от них просветом
# и читается без догадок. Глубина — по боку, построчно: торс кверху сужается
# (125 пикселей у плеч против 192 у низа), и с одной глубиной край принта на
# уровне груди улетал бы за силуэт.
#
# Кадры совмещаются по низу торса — последней строке шире 100 пикселей. Это
# одна и та же линия ткани на всех трёх кадрах, в отличие от якоря «низ»,
# который на переде и спине поставлен по-разному.
torso:
  provisional: true
  method: >
    ширина по кадрам переда и спины ниже рукавов (y 440…580), глубина по
    боковому кадру построчно, передний край на высоте манжеты (390…485)
    интерполирован между соседними строками
  # Боковой шов. 90° — от центра переда до самого бока, то есть перед и
  # спинка равной ширины: обычный крой. На боковом кадре есть линия на x≈410,
  # но её угол по модели меняется от 154° вверху до 120° внизу — шов на
  # постоянном угле так себя не ведёт. Решено 24.09.2026: владелец положения
  # шва не знает, для прототипа оно неважно, оставлено 90°. Для настоящего
  # изделия угол берётся из лекала.
  side_seam_deg: 90
  views:
    front: {facing_deg: 0, centre_x: 360, half_px: 124, hem_y: 598}
    back: {facing_deg: 180, centre_x: 358.5, half_px: 129.5, hem_y: 566}
    left:
      facing_deg: 90
      hem_y: 592
      # [y, передний край, задний край] — пиксели бокового кадра.
      rows: [[220, 301, 422], [240, 298, 423], [260, 291, 426], [280, 285, 429],
             [300, 281, 432], [320, 278, 434], [340, 275, 436], [360, 272, 438],
             [380, 269, 441], [400, 268, 443], [420, 267, 445], [440, 266, 446],
             [460, 264, 448], [480, 263, 450], [500, 262, 451], [520, 261, 453],
             [540, 266, 451], [560, 262, 452], [580, 274, 445]]

# Размерная сетка: во сколько раз изделие размера больше базового. ОТДЕЛЬНАЯ
# таблица, а не поля печати (запрет №8): поле — ограничение, «сколько можно
# печатать», сетка — преобразование, «во сколько раз больше». От сетки идут и
# масштаб изделия на кадре, и коэффициент принта по умолчанию.
#
# Настоящая, из Cosmic: выгружена 24.09.2026 из cosmicplm-db ролью только на
# чтение plmportal_ro, разрешение владельца в чате. Самого B-HDY-14 в Cosmic нет —
# код пришёл из имени файла Browzwear, — поэтому взяты табели мер двенадцати
# девичьих толстовок на молнии с капюшоном, у которых заполнен весь ряд 98–164
# (master_id 473, 5809, 6962, 8679, 9227, 9325, 9875, 9880, 10308, 10613,
# 10880, 12162). Коэффициент — медиана по ним, разброс ±0.007.
#
# Коэффициент — по ШИРИНЕ ГРУДИ под проймой: принт на груди градуируют по
# ширине, и по ней же он выходит за поле. Длина по центру спинки растёт быстрее
# (98 — ×0.721 против ×0.779), она записана рядом комментарием и пока в расчёт
# не идёт: положение по вертикали считается тем же коэффициентом — упрощение.
size_grid:
  provisional: true
  base: 134
  method: медиана ширины груди по 12 табелям толстовок на молнии из Cosmic; B-HDY-14 там нет
  by_size:
    98: 0.779   # длина ×0.721
    104: 0.817   # длина ×0.765
    110: 0.853   # длина ×0.809
    116: 0.890   # длина ×0.855
    122: 0.927   # длина ×0.899
    128: 0.964   # длина ×0.945
    134: 1.000   # длина ×1.000
    140: 1.037   # длина ×1.044
    146: 1.073   # длина ×1.088
    152: 1.110   # длина ×1.132
    158: 1.147   # длина ×1.176
    164: 1.183   # длина ×1.220

print_fields:
  provisional: true
  unit: cm
  by_size:
    98:  {front: [16, 18], back: [20, 24]}
    110: {front: [17, 20], back: [22, 26]}
    122: {front: [19, 22], back: [25, 29]}
    134: {front: [21, 24], back: [28, 33]}
    146: {front: [23, 26], back: [30, 36]}
    158: {front: [25, 28], back: [32, 39]}
    164: {front: [26, 29], back: [33, 40]}

# Пороги проверок, которым не нужны печатные поля. Лежат здесь, а не в коде:
# у шелкографии и DTF они разные, и менять их будет технолог.
#
# ПРЕДВАРИТЕЛЬНЫЕ: взяты по обычной практике шелкографии и подлежат уточнению.
print_rules:
  provisional: true
  method: silkscreen
  min_letter_cm: 0.4     # ниже не пропечатается
  warn_letter_cm: 0.6    # ниже пропечатается неровно
  min_stroke_cm: 0.05    # тоньше не пропечатается
  max_colours: 4         # каждый цвет в шелкографии печатается отдельно

# Стратегия градации принта. Фиксированная по умолчанию: один физический размер
# печати на весь ряд — дешевле в производстве. Не путать с таблицей выше: та
# ограничение, эта преобразование.
grading: {strategy: fixed}
