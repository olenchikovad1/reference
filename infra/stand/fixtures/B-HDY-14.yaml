# Изделие B-HDY-14 — единственное изделие стенда.
#
# В репозитории лежит только это описание. Сами файлы — в томе файлового
# пространства (`infra/stand/files/`), он в .gitignore: 444 МБ в git не кладут,
# а кадры состояний — данные изделия, не код.
#
# Хеши здесь затем, чтобы подмена файла в томе была видна, а не обнаруживалась
# по странному результату проверок.

code: B-HDY-14
display_name: Толстовка на молнии, капюшон
kind: hoodie

# Источник модели. Browzwear VStitcher 13.3.2 — не CLO 3D. Контейнер: SQLite
# с zstd-сжатыми блобами; лекала, швы в сантиметрах и градация лежат внутри,
# но формат закрытый, поэтому читается только то, что отдаёт VStitcher.
source:
  tool: browzwear-vstitcher
  tool_version: "13.3.2"
  path: products/B-HDY-14/source/1465 B-HDE.bw   # относительно FILES_VOLUME_PATH
  size_bytes: 444334080
  sha256: c0f1f9d031b5ef652412885b5846ee836ca321906db9746776a4be50cea3cb2d

# Размерный ряд из модели: рост 98–164, девочки. Не S/M/L/XL — разброс между
# крайними размерами здесь гораздо больше, и «влезает ли на S» означает «на 98».
size_set:
  name: 98-164 Девочки
  sizes: [98, 104, 110, 116, 122, 128, 134, 140, 146, 152, 158, 164]
  simulated: [98, 134, 164]     # для остальных симуляции в модели нет

# ВАЖНО: какой размер отрендерен — неизвестно. В именах кадров размера нет, а
# сам кадр этого не говорит. Разница между 98-м и 164-м больше половины, и
# ошибка здесь означает печать в полтора раза не того размера. Пока принято
# допущение, что это середина ряда; US-0430 попробует измерить по мешу.
rendered_size: null
rendered_size_assumed: 134

# Калибровка «сантиметры лекала ↔ пиксели кадра».
#
# ПРЕДВАРИТЕЛЬНАЯ. Получена делением измеренной высоты силуэта на прикидочную
# высоту изделия: 576 px на ~70 см у 134-го размера с надетым капюшоном.
# Настоящее число придёт из US-0430 либо от человека с рулеткой, и заменяется
# правкой этой строки — без кода и без пересборки.
#
# Границы неопределённости названы, чтобы никто не принял число за измерение:
# если отрендерен 164-й, будет около 7.4; если 98-й — около 11.5.
calibration:
  px_per_cm: 8.2
  provisional: true
  derived_from: высота силуэта 576 px при допущении ~70 см
  range_if_size_unknown: [7.4, 11.5]
  projection: perspective
  note: >-
    При ортографической камере силуэты переда и спины — зеркальные отражения с
    одинаковым габаритом. Здесь ширина 626 против 574 при общем центре, значит
    камера перспективная и единого px/см на весь кадр не существует. Калибруется
    плоскость печатной зоны; на краях силуэта погрешность больше, но там ничего
    не размещают.

# Состояния. Сейчас одно: капюшон надет, молния застёгнута.
states:
  - code: front
    display_name: Перед
    kind: precise              # по точным ракурсам считаются размещение и проверки
    hood: up
    zipper: closed
    frame: {path: products/B-HDY-14/states/front.png, width: 720, height: 720,
            sha256: 212bb0fcdcc00a89988470d077ff3a1ef97ee42332873102275533274afce6f2}
    # Кадр обесцвечен (насыщенность ровно 0), поэтому служит одновременно картой
    # освещения: цвет накладывается умножением, рельеф выводится из него же.
    maps: {lighting: frame, displacement: derived, ao: null, print_zone: manual}
    silhouette: {top: 26, bottom: 601, height_px: 576}
    # Ориентиры. От них отсчитывается размещение: «12 см ниже горловины».
    # Координаты в пикселях кадра, сняты по силуэту и по сетке.
    anchors:
      neck: [360, 215]         # низ проёма капюшона, он же линия воротника
      centre: [360, 380]       # центр переда
      hem: [360, 601]          # низ подола
      shoulder_left: [258, 228]
      shoulder_right: [462, 228]
    zones:
      # Куда можно печатать. Перед разрезан молнией, поэтому зона названа одна,
      # а молния лежит отдельной линией: пересечение с ней ловит линтер.
      # Верх поля — линия воротника, она же низ капюшона.
      print: [[252, 214], [468, 214], [468, 430], [252, 430]]
      pocket: [[272, 435], [448, 435], [440, 535], [280, 535]]
      hood: [[300, 26], [420, 26], [432, 120], [418, 195], [360, 212],
             [302, 195], [288, 120]]
    lines:
      zipper: [[360, 215], [360, 570]]

  - code: back
    display_name: Спина
    kind: precise
    hood: up
    zipper: closed
    frame: {path: products/B-HDY-14/states/back.png, width: 720, height: 720,
            sha256: 3960994617db8aaaba92dbe928f1478b65182c45a0fba64ea59beab703f3676d}
    defects:
      - clipped_top           # верх капюшона срезан границей кадра: 21 непрозрачный
                              # пиксель в нулевой строке
    maps: {lighting: frame, displacement: derived, ao: null, print_zone: manual}
    silhouette: {top: 0, bottom: 572, height_px: 573}
    anchors:
      neck: [360, 178]         # низ капюшона по центру спины
      centre: [360, 350]
      hem: [360, 555]
      shoulder_left: [252, 190]
      shoulder_right: [468, 190]
    zones:
      # Верх поля упирается в низ капюшона: выше печатать физически можно,
      # но там ляжет капюшон — на это и срабатывает проверка перекрытия.
      print: [[248, 180], [472, 180], [472, 505], [248, 505]]
      # Капюшон лежит ПОВЕРХ верха спины. Без этой зоны кадр спины врёт в самом
      # важном месте: принт, нарисованный сверху, показывает то, чего не бывает.
      hood: [[300, 0], [420, 0], [433, 60], [437, 120], [424, 155],
             [390, 176], [360, 179], [330, 176], [296, 155], [283, 120],
             [287, 60]]
    lines: {}

  - code: left
    display_name: Левый бок
    kind: illustrative        # только показ: силуэт сокращён втрое, размещать нельзя
    hood: up
    zipper: closed
    frame: {path: products/B-HDY-14/states/left.png, width: 720, height: 720,
            sha256: 8e881e63311806c32c66eb3398e909b678a06296a76f277370f12d27df1a7f1c}
    maps: {lighting: frame, displacement: derived, ao: null, print_zone: manual}
    silhouette: {top: 11, bottom: 601, height_px: 591}
    anchors: {}
    zones: {}
    lines: {}

# Состояния, которых нет и которые в прототипе не появятся. Названы затем,
# чтобы отсутствие читалось как известное ограничение, а не как недоделка.
states_absent: [hood_down, zipper_open]

# Печатные поля по размерам — ограничение, куда физически можно печатать.
#
# ПРЕДВАРИТЕЛЬНЫЕ. Настоящие даёт технолог; эти прикинуты от ширины корпуса на
# кадре и линейно разведены по ряду. Нужны, чтобы проверкам было на чём
# работать, и помечены, чтобы их не приняли за таблицу технолога.
print_fields:
  provisional: true
  unit: cm
  by_size:
    98:  {front: [16, 18], back: [20, 24]}
    110: {front: [17, 20], back: [22, 26]}
    122: {front: [19, 22], back: [25, 29]}
    134: {front: [21, 24], back: [28, 33]}
    146: {front: [23, 26], back: [30, 36]}
    158: {front: [25, 28], back: [32, 39]}
    164: {front: [26, 29], back: [33, 40]}

# Стратегия градации принта. Фиксированная по умолчанию: один физический размер
# печати на весь ряд — дешевле в производстве. Не путать с таблицей выше: та
# ограничение, эта преобразование.
grading: {strategy: fixed}
