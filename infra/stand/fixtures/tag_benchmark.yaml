# Замеры — ниже, отдельными разделами: «было» у нынешней модели и каждое
# следующее «стало». Пишутся выводом scripts/embeddings/measure_tag_benchmark.py.

# «Было»: нынешняя модель, 28.09.2026, до любых изменений плана 087.
# clip-vit-b32-multilingual/quint8/freq2011/d317ada3, 9860 слов, доля сильных
# 0.2. Столбцы: картинок, ожидаемых тегов, из них слов нет в словаре, попало в
# сильные, попало в двадцатку, сильных всего, сильных лишних, F1 по сильным.
# Хуже всего аниме и надписи: сильные теги там почти целиком мимо
# («самурай, кимоно, медсестра» у девушки в матроске; «логотип, эпиграмма» у
# букв). Сцену у танков модель не ставит ни разу: у всех семи «нет: снег,
# зима». Слов «аниме» и «волосы» в рабочем словаре нет вовсе.
measured_before:
  model: clip-vit-b32-multilingual/quint8/freq2011/d317ada3
  date: 2026-09-28
  by_kind:
    #             [карт, ожид, нет слова, в сильных, в 20, сильных, лишних, F1]
    anime:        [9,  52, 20,  3,  5, 82, 79, 0.04]
    illustration: [8,  18,  0,  8, 14, 38, 30, 0.29]
    flat:         [11, 25,  1, 10, 17, 76, 66, 0.20]
    text:         [8,  24,  1,  1,  2, 50, 49, 0.03]
    photo:        [15, 67,  2, 16, 21, 85, 69, 0.21]
    total:        [51, 186, 24, 38, 59, 331, 293, 0.15]
  not_in_vocabulary: [аниме, волосы, граффити, единорог, пазл, самокат, толстовка, усы, чулки]

# Маршрутизатор видов (US-0625), 28.09.2026: нулевой классификатор — вектор
# картинки против фраз вида (scripts/embeddings/measure_router.py). Вид
# целиком различается плохо — фото путается с иллюстрацией (рендеры танков в
# мягкой рамке модель считает рисунком), но маршрут решает одно: аниме — в
# аниме-модель, остальное — в общую, где фото, иллюстрации, плоская графика и
# надписи размечаются одной моделью (US-0627). Неуверенная (зазор первого и
# второго вида меньше порога) идёт в модели обоих видов.
# Выбрано: многоязычная половина (она и так в памяти ради тегов), порог 0.015.
measured_router:
  date: 2026-09-28
  phrases: "по 3–4 английских фразы на вид, среднее сходство"
  kind_accuracy:
    #                      [аниме, иллюстр., плоская, надпись, фото, всего из 51]
    english_clip:          [8/9, 1/8, 10/11, 8/8, 4/15, 31]
    multilingual:          [9/9, 1/8, 6/11, 8/8, 5/15, 29]
  anime_route_multilingual:
    # порог: аниме дошло до аниме-модели / 9; чужих в ней; не-аниме в общей / 42
    "0.000": [9, 1, 41]
    "0.004": [9, 1, 41]
    "0.010": [9, 2, 41]
    "0.015": [9, 2, 42]
  chosen_gap: 0.015
  caveat: >-
    Порог предварительный: подобран на том же наборе, на котором мерится, —
    других размеченных аниме нет. Ложное «аниме» — геральдический единорог
    (зазор 0.013) и один из рисунков; при пороге 0.015 они идут в обе модели.

# Аниме-разметчик (US-0626), 28.09.2026: три кандидата WD-tagger v3 на девяти
# аниме эталона, теги — переведённые и показанные (services/anime.py) плюс
# тег вида «аниме» (scripts/embeddings/measure_anime_candidates.py). Столбцы:
# ожидаемо, попало, показано, лишних, F1, секунд на картинку (процессор,
# RBB-0001), память в работе, МБ.
measured_anime:
  date: 2026-09-28
  before_clip:            [52,  3,  82,  79, 0.04]
  # Перевод — 335 частых тегов Danbooru, как записан до замера.
  translation_335:
    wd-eva02-large-tagger-v3: [52, 36, 166, 114, 0.33, 5.06, 2077]
    wd-swinv2-tagger-v3:      [52, 36, 171, 118, 0.32, 2.00,  811]
    wd-vit-tagger-v3:         [52, 34, 149,  99, 0.34, 1.31,  686]
  # После добавки 25 переводов, которых не хватило на этих картинках
  # (портфель, пиджак, указывает пальцем, сакура, флаг…) и «девочки» у 1girl.
  # Добавка подсмотрена на эталоне — числа ниже с «было» сравнивать с этой
  # оговоркой.
  translation_360:
    wd-eva02-large-tagger-v3: [52, 45, 199, 130, 0.36, 4.32, 2098]
    wd-swinv2-tagger-v3:      [52, 43, 198, 130, 0.34, 1.94,  811]
    wd-vit-tagger-v3:         [52, 41, 174, 108, 0.36, 1.26,  652]
  chosen: wd-swinv2-tagger-v3
  why: >-
    eva02-large одна занимает 2 ГБ — весь бюджет моделей (models.json), при
    почти том же качестве. Из двух лёгких swinv2 находит больше ожидаемого
    (43 против 41), vit — меньше лишнего; жалоба дизайнера — «не нахожу»,
    поэтому полнота. Сжатие не нужно: 811 МБ влезают в бюджет вместе с CLIP.
  still_missing: "флаг, швабра, пазл, самокат, белка (squirrel_ears переведены не были), небо, платье, ухо у anime-girl"
