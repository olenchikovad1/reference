# Эталон тегов по видам картинок (план 087, US-0623).
#
# Зачем: сказать «новые модели размечают лучше» можно только против записанного
# ожидания. Прежние ожидания (prints.yaml, tags_expected) — это семь танков в
# снегу и по два-три слова на остальное; по ним не видно, что модель делает с
# аниме, надписью или фото.
#
# Записано 28.09.2026 ДО любого замера автотегов на этом наборе — по листам
# миниатюр (scripts/prints/contact_sheet.py), а не по именам файлов: имя
# is3-summer врало дважды. Ожидания не правятся по результату замера: иначе
# они становятся пересказом того, что модель выдала.
#
# Вид — то, по чему картинка пойдёт в свою модель (US-0625):
#   anime        — аниме и манга: персонаж, нарисованный в этой манере;
#   illustration — рисунок с объёмом, светотенью, фактурой;
#   flat         — векторная и плоская графика: заливки, контур, клипарт;
#   text         — надпись и типографика: главное на картинке — буквы;
#   photo        — фото и фотореалистичный рендер (танки — кадры игры).
# also — второй вид смешанной картинки: такая обязана уйти в обе модели.
#
# tags — ожидаемые теги в словарной форме: именительный падеж, единственное
# число, как слово стоит в словаре (ё пишется, при сверке она равна е).
# Слова, которых в словаре нынешней модели нет вовсе, замер считает отдельно:
# их она не поставит ни при каком качестве.
#
# Сколько каждого вида (основной вид): аниме 9, иллюстрации 8, плоская 11,
# надписи 8, фото 15 — из них 9 рендеров военной техники, настоящих фото 6.
# Слабость набора: фото перекошены к танкам в снегу; снег без танка — две
# картинки (гора Худ, тропа). Картинки с аниме-наклейкой на фото нет —
# смешанное «аниме + фото» проверить не на чем (к US-0625).

