# Замеры — ниже, отдельными разделами: «было» у нынешней модели и каждое
# следующее «стало». Пишутся выводом scripts/embeddings/measure_tag_benchmark.py.

# «Было»: нынешняя модель, 28.09.2026, до любых изменений плана 087.
# clip-vit-b32-multilingual/quint8/freq2011/d317ada3, 9860 слов, доля сильных
# 0.2. Столбцы: картинок, ожидаемых тегов, из них слов нет в словаре, попало в
# сильные, попало в двадцатку, сильных всего, сильных лишних, F1 по сильным.
# Хуже всего аниме и надписи: сильные теги там почти целиком мимо
# («самурай, кимоно, медсестра» у девушки в матроске; «логотип, эпиграмма» у
# букв). Сцену у танков модель не ставит ни разу: у всех семи «нет: снег,
# зима». Слов «аниме» и «волосы» в рабочем словаре нет вовсе.
