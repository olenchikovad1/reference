# Словарь автотегов. Данные, а не код: пополнить словарь — правка этого файла,
# а не выкатка (US-0478).
#
# ТЕГИ СОРЕВНУЮТСЯ ВНУТРИ СВОЕЙ ГРУППЫ, а не со всем словарём. Так вышло из
# замера: у тегов разный «фон» — всё военное (корабль, ракета, солдат) набирает
# 0.25–0.27 на любом танке просто потому, что картинка военная, а «снег» на
# заснеженном танке — 0.23–0.26. Одним порогом на все теги снег всегда
# проигрывал случайному «кораблю». Внутри группы «местность» снег спорит только
# с лесом, морем и белым фоном — и выигрывает там, где он есть.
#
# У тега:
#   name     — как тег видит человек;
#   prompts  — английские формулировки для модели: CLIP понимает только
#              английский, и несколько формулировок ловят лучше одной;
#   search   — русские основы слова для поиска: «снежное» находит «Снег» по
#              основе «снеж», модель для этого не нужна;
#   hidden   — соперник, которого не показывают: «белый фон» нужен, чтобы
#              белое у надписи не засчитывалось за снег;
#   implies  — тег, который следует из этого: снег — это зимняя сцена.
#
# Словарь нарочно ШИРЕ набора из восьми танков: пороги подбираются на нём, но
# работать обязаны на картинках, которых при подборе не было — первыми будут
# ракетные крейсеры владельца.
model: clip-vit-base-patch32/text/quantized
template: "a photo of {}"

groups:
  - code: object
    name: что изображено
    tags:
      - {code: tank, name: Танк, prompts: [a tank, an armored tank, a military tank, a self-propelled artillery gun],
         search: [танк, бронетехник, сау, самоходк], implies: [machinery, military]}
      - {code: helicopter, name: Вертолёт, prompts: [a helicopter, a military helicopter], search: [вертол, вертушк],
         implies: [machinery, aviation, military]}
      - {code: airplane, name: Самолёт, prompts: [an airplane, a fighter jet, a military aircraft],
         search: [самол, истребит, бомбардир], implies: [machinery, aviation, military]}
      - {code: warship, name: Корабль, prompts: [a warship, a navy ship, a battleship, a missile cruiser],
         search: [корабл, крейсер, эсминец, линкор, судн, фрегат],
         implies: [machinery, navy, military]}
      - {code: submarine, name: Подводная лодка, prompts: [a submarine], search: [подлодк, подводн],
         implies: [machinery, navy, military]}
      - {code: missile, name: Ракета, prompts: [a missile, a rocket launch, missiles], search: [ракет], implies: [military]}
      - {code: vehicle, name: Автомобиль, prompts: [a military truck, a car], search: [автомоб, машин, грузовик], implies: [machinery]}
      - {code: soldier, name: Солдат, prompts: [a soldier, soldiers], search: [солдат, бойц, воин], implies: [military]}
      - {code: text, name: Надпись, prompts: [text, a slogan, lettering, typography], search: [надпис, текст, слоган, шрифт]}
      - {code: clothing, name: одежда, hidden: true, prompts: [a hoodie, a piece of clothing]}
      - {code: pattern, name: узор, hidden: true, prompts: [an abstract pattern, a plain background]}
  - code: ground
    name: местность
    tags:
      - {code: snow, name: Снег, prompts: [snow, a snowy landscape, ground covered in snow], search: [снег, снеж],
         implies: [winter]}
      - {code: forest, name: Лес, prompts: [a forest, trees, pine trees], search: [лес, дерев, ёлк, елк, ель, сосн]}
      - {code: mountains, name: Горы, prompts: [mountains, a mountain landscape], search: [гор, скал]}
      - {code: sea, name: Море, prompts: [the sea, the ocean, sea waves], search: [мор, океан, волн]}
      - {code: desert, name: Пустыня, prompts: [a desert, sand dunes], search: [пустын, песок, песк]}
      - {code: city, name: Город, prompts: [a city, city streets, buildings], search: [город, улиц, здани]}
      - {code: grass, name: Трава, prompts: [green grass, a green summer field], search: [трав, пол, луг],
         implies: [summer]}
      - {code: autumn_leaves, name: Осенние листья, prompts: [autumn foliage, fallen leaves], search: [листв, листь],
         implies: [autumn]}
      - {code: white_background, name: белый фон, hidden: true, prompts: [a plain white background, an empty white background]}
  - code: sky
    name: небо и воздух
    tags:
      - {code: sky, name: Небо, prompts: [the sky, clouds in the sky, a blue sky], search: [неб, облак]}
      - {code: sunset, name: Закат, prompts: [a sunset, a sunset sky], search: [закат, рассвет]}
      - {code: night, name: Ночь, prompts: [at night, a night sky], search: [ноч]}
      - {code: fire, name: Огонь, prompts: [fire, flames], search: [огон, огн, плам, пожар]}
      - {code: smoke, name: Дым, prompts: [smoke, clouds of smoke], search: [дым]}
      - {code: explosion, name: Взрыв, prompts: [an explosion], search: [взрыв]}
      - {code: no_sky, name: без неба, hidden: true, prompts: [a plain background without sky]}
  # «Камуфляж» из автотегов убран замером 24.09.2026: модель не отличает
  # камуфляж от «военной техники вообще». Единственный камуфлированный принт
  # набора набрал 0.268 — меньше обычного зимнего ИС-3 (0.279); картинки без
  # техники проваливаются вниз, вся техника остаётся наверху. Подбирать порог
  # под один принт значит завести тег, который врёт на каждом следующем.

# Теги, которые не распознаются, а следуют из других (implies). Отдельно
# названы, чтобы искались: «зимнее» находит всё снежное, «военное» — всю технику.
#
# Общие слова — «Техника», «Военное», «Авиация» — выводятся из тега объекта, а
# не спрашиваются у модели: танк — это техника по определению, и угадывать тут
# нечего. Цена: «Военное» следует из вертолёта и самолёта, поэтому гражданский
# вертолёт тоже станет военным. В наборе гражданской техники нет ни одной
# картинки, и отличать военное от гражданского модели учиться не на чем —
# появится такая, тогда «Военное» переедет в распознаваемые, с замером.
derived:
  - {code: winter, name: Зима, search: [зим]}
  - {code: summer, name: Лето, search: [лето, летн]}
  - {code: autumn, name: Осень, search: [осен]}
  - {code: machinery, name: Техника, search: [техник]}
  - {code: military, name: Военное, search: [воен, арми, милитар]}
  - {code: aviation, name: Авиация, search: [авиац]}
  - {code: navy, name: Флот, search: [флот, морск]}
