# Надстройка: «Референс» за шлюзом стенда платформы (план 072, US-0483).
#
# Отдельным файлом, а не в compose.yaml: сеть платформы внешняя, и без
# поднятого стенда платформы основной стенд с ней не стартовал бы вовсе, а он
# обязан подниматься и сам по себе (решение 0006). С платформой:
#
#   docker compose -f infra/compose.yaml -f infra/compose.platform.yaml up -d
#
# Фронтенд входит в сеть платформы под именем reference-web — это имя и есть
# адрес приложения в реестре платформы (http://reference-web:5173). Не через
# хозяйскую машину: адрес внутри сети не зависит от проброса портов.
services:
  # Сервис в сеть платформы НЕ входит: там свой postgres, и имя postgres из
  # строки подключения разрешилось в чужую базу («password authentication
  # failed», 25.09.2026). К ядру — публикация манифеста и ключи для токенов —
  # он ходит через шлюз платформы на хозяйской машине, как любой внешний
  # клиент: PLATFORM_CORE_URL=http://host.docker.internal:8100/platform/api/core.
  api:
    extra_hosts: ["host.docker.internal:host-gateway"]
  web:
    networks:
      default: {}
      platform:
        aliases: [reference-web]

networks:
  platform:
    external: true
    name: platform_default
