[project]
name = "reference-api"
version = "0.1.0"
description = "Сервис приложения «Референс»: принты, изделия, согласование"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "aio-pika",
    "boto3",
    "pgvector",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reference_api"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
# Тесты с суффиксом _db ходят в настоящую базу и в рабочем цикле не гоняются:
# быстрые — в работе, тяжёлые один раз на блок.
testpaths = ["tests"]
asyncio_mode = "auto"
