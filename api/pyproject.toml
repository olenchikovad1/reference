[project]
name = "reference-api"
version = "0.1.0"
description = "Сервис приложения «Референс»: принты, изделия, согласование"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "aio-pika",
    "boto3",
    "pgvector",
    # Описание изделия правит человек, а не программа: YAML читается глазами и
    # терпит комментарии, в которых половина смысла фикстуры.
    "pyyaml",
    # Ступени изображений. Те же имена и правила, что у сервиса файлов
    # платформы, чтобы переезд к ней был правкой одного слоя.
    "pillow",
    # Загрузка файлов формой: без него FastAPI отказывается даже собирать
    # маршрут, и падают ВСЕ тесты, а не только про файлы.
    "python-multipart",
    # Модель эмбеддингов исполняется локально: принты — невыпущенные
    # коллекции, наружу их отправлять нельзя (решение 0008).
    "onnxruntime",
    # Разбор слов для текстовой половины CLIP — автотеги (решение 0011).
    "tokenizers>=0.23,<0.24",
    "numpy",
    # Разбор токена платформы, объявление прав на маршрутах, проверка при старте,
    # что изменяющего маршрута без права нет (план 072, US-0486, US-0487).
    "platform-client==0.4.0",
    # Зависимость platform-client — прямой строкой: `uv pip install` привязывает
    # индекс (tool.uv.sources) только к прямым зависимостям, и транзитивный
    # service-kit искался бы на PyPI, где его нет.
    "service-kit==0.2.0",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy"]

# Пакет платформы — ТОЛЬКО из её индекса и по-пакетно, как у plm: одноимённый
# platform-client есть в общедоступном PyPI, это чужой пакет, и без привязки в
# сборку уехал бы он. Остальные зависимости — с PyPI, поэтому индекс по
# умолчанию не подменяется.
[[tool.uv.index]]
name = "platform"
url = "https://platform.toribrands.ru/platform/pypi/simple/"
explicit = true

[tool.uv.sources]
platform-client = { index = "platform" }
service-kit = { index = "platform" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reference_api"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
# Тесты с суффиксом _db ходят в настоящую базу и в рабочем цикле не гоняются:
# быстрые — в работе, тяжёлые один раз на блок.
testpaths = ["tests"]
asyncio_mode = "auto"
