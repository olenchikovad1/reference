[project]
name = "reference-api"
version = "0.1.0"
description = "Сервис приложения «Референс»: принты, изделия, согласование"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "aio-pika",
    "boto3",
    "pgvector",
    # Описание изделия правит человек, а не программа: YAML читается глазами и
    # терпит комментарии, в которых половина смысла фикстуры.
    "pyyaml",
    # Ступени изображений. Те же имена и правила, что у сервиса файлов
    # платформы, чтобы переезд к ней был правкой одного слоя.
    "pillow",
    # Загрузка файлов формой: без него FastAPI отказывается даже собирать
    # маршрут, и падают ВСЕ тесты, а не только про файлы.
    "python-multipart",
    # Модель эмбеддингов исполняется локально: принты — невыпущенные
    # коллекции, наружу их отправлять нельзя (решение 0008).
    "onnxruntime",
    # Разбор слов для текстовой половины CLIP — автотеги (решение 0011).
    "tokenizers>=0.23,<0.24",
    "numpy",
    # Разбор токена платформы, объявление прав на маршрутах, проверка при старте,
    # что изменяющего маршрута без права нет (план 072, US-0486, US-0487); 0.5.0 —
    # токен от своего имени на колокол платформы (её решение 0029, US-0513).
    "platform-client==0.5.0",
    # Зависимость platform-client — прямой строкой: `uv pip install` привязывает
    # индекс (tool.uv.sources) только к прямым зависимостям, и транзитивный
    # service-kit искался бы на PyPI, где его нет.
    "service-kit==0.2.0",
    # Расшифровка голосовых замечаний своей моделью — голос не уходит в чужой
    # сервис (решение 0017). Версия закреплена: библиотека тянет ctranslate2 и
    # av (ffmpeg внутри колеса), их смена меняет расшифровку молча.
    "faster-whisper==1.2.1",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy"]

# Пакет платформы — ТОЛЬКО из её индекса и по-пакетно, как у plm: одноимённый
# platform-client есть в общедоступном PyPI, это чужой пакет, и без привязки в
# сборку уехал бы он. Остальные зависимости — с PyPI, поэтому индекс по
# умолчанию не подменяется.
[[tool.uv.index]]
name = "platform"
url = "https://platform.toribrands.ru/platform/pypi/simple/"
explicit = true

[tool.uv.sources]
platform-client = { index = "platform" }
service-kit = { index = "platform" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reference_api"]

[tool.ruff]
line-length = 100
target-version = "py313"

# Только правила, которые ловят дефект. Вид кода (порядок импортов, длина
# строки, флаг исполняемости файла) не проверяется: замечание, которое не
# меняет поведения, топит в отчёте те, что меняют, — так их было 312 при двух
# настоящих (06.10.2026).
[tool.ruff.lint]
select = [
    "F",       # неопределённое имя, неиспользуемый импорт, переопределение
    "E9",      # синтаксис
    "B",       # изменяемое умолчание, потерянное исключение, ошибки сравнения
    "BLE",     # молча проглоченное `except Exception` — только с причиной
    "RUF100",  # `noqa`, который уже ничего не подавляет, — обход без повода
]
ignore = [
    "B008",    # `Depends(...)` в умолчании — способ FastAPI, а не ошибка
]

[tool.ruff.lint.per-file-ignores]
# Оснастка pytest, взятая импортом из соседнего файла, приходит параметром
# с тем же именем: pyflakes считает это переопределением, pytest — способом
# подключить оснастку. Ложное срабатывание, не дефект.
"tests/**" = ["F811"]

# Строгость поднимается по одному правилу, каждый раз до нуля
# (quality-typing). Сейчас: всё, что ловит «поле у того, чего может не быть»
# и неверный тип аргумента, в том числе в функциях без аннотаций. Следующий
# шаг — disallow_untyped_defs (37 мест на 06.10.2026).
[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true

# Библиотеки без описаний типов: проверять в них нечего, а замечание
# «описаний нет» повторялось бы на каждом импорте. Список закрытый — новая
# библиотека без типов появится в отчёте, а не пройдёт молча.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "onnxruntime", "faster_whisper", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Тесты с суффиксом _db ходят в настоящую базу и в рабочем цикле не гоняются:
# быстрые — в работе, тяжёлые один раз на блок.
testpaths = ["tests"]
asyncio_mode = "auto"
