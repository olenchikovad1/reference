# Слова, которые не вешаются на картинку тегом никогда (US-0482).
#
# Это не список допустимого — допустимое не перечислено нигде, теги берутся из
# словаря языка. Здесь одна категория, которую нельзя приписывать картинке:
# принадлежность людей к народу, стране, вере или политической силе. Модель
# ставит такие слова по ассоциации, а не по изображённому: на заснеженных
# танках в двадцатку попадали «славянин», «татарин», «чеченец», «украинец»,
# «большевик», «белорус», «таджик», «эскимос». Тег — это утверждение о
# картинке, и такое утверждение машина делать не вправе.
#
# Перечень, а не правило, потому что правило не вышло (замер 24.09.2026,
# решение 0011, дополнение): ни близость к понятию «национальность», ни
# уточнение «по национальности», ни направление по примерам категорию в
# пространстве слов не отделяют. Слово, которого нет в частотном словаре, сюда
# не пишется: тегом оно стать не может, а проверить перечень становится нельзя.
# Сверен с первыми шестьюдесятью словами каждой картинки набора prints.yaml;
# слово-группа, которого здесь нет, на новой картинке пройдёт — дополняется
# сюда же.
#
# Сознательно НЕ исключены: жители городов и краёв («москвич», «сибиряк») —
# это место, а не народ; названия учений и вер («христианство», «коммунизм») —
# на картинке с храмом или плакатом они бывают верны; военные и профессии
# («солдат», «танкист», «красноармеец») — их на картинке видно.

