# Общепринятые сокращения для поиска (US-0498): модель смысла их не знает —
# «НГ» для неё две буквы. Это словарь языка, а не список допустимого: своё
# название дропа дописывается у самого дропа, в «как его ещё называют».
#
# Ключ — сокращение в любом регистре, значение — чем его заменить в запросе.
НГ: новый год
НГ2027: новый год 2027
23Ф: 23 февраля
23 ФЕВ: 23 февраля
ДЗО: день защитника отечества
8М: 8 марта
ДР: день рождения
1С: 1 сентября
ШК: школа
ХЭЛЛОУИН: хэллоуин тыква
