# «Референс» в бою на hub: статика сборки и проброс к сервису на sandbox.
# Сервис доступен туннелем (контейнер reference-tunnel в той же сети, порт 8031)
# — см. infra/compose.hub.yaml. Шлюз платформы приходит сюда по имени
# reference-web:5173, как и на стенде.
server {
    listen 5173;
    server_name _;

    # Картинки и голос замечаний приходят телом запроса: предел — как у шлюза.
    client_max_body_size 256m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Имя туннеля разрешается при запросе, а не при старте: иначе nginx не
    # поднимался бы, пока туннель не готов (проверено 07.10.2026). 127.0.0.11 —
    # DNS докера.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api http://reference-tunnel:8031;

    # Ядро читает описание приложения по адресу приложения + /manifest — в
    # корне, мимо /reference/. Отдаёт его сервис.
    location = /manifest {
        proxy_pass $api/reference/api/manifest;
    }

    location /reference/api/ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # Приложение одностраничное: любой путь под /reference/ — его index.html.
    # Точку входа браузер не хранит (имена файлов с отпечатками меняются).
    location /reference/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /reference/index.html;
        location = /reference/index.html { add_header Cache-Control "no-store"; }
    }
}
